<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dogecoin Core — Base44 Preview</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #10141c; color: #f4f6f8; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #263653 0, #10141c 48%); }
    main { width: min(760px, 100%); padding: 40px; border: 1px solid #38445a; border-radius: 20px; background: rgba(20, 26, 37, .94); box-shadow: 0 24px 80px rgba(0, 0, 0, .35); }
    .eyebrow { color: #c2a633; font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1; }
    p { color: #aeb7c7; line-height: 1.6; }
    .status { display: flex; align-items: center; gap: 10px; margin: 28px 0; padding: 16px 18px; border-radius: 12px; background: #171e2a; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #e0a63b; box-shadow: 0 0 14px currentColor; }
    .connected .dot { background: #4bd18b; }
    .error .dot { background: #ef6464; }
    code { color: #d8be4b; }
    pre { min-height: 112px; overflow: auto; margin: 0; padding: 18px; border: 1px solid #303b4e; border-radius: 12px; background: #0d1118; color: #9fd6b8; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Base44 development environment</div>
    <h1>Dogecoin Core</h1>
    <p>A local <strong>regtest</strong> node is running from the repository source. This preview listens to its native ZMQ stream through the WebSocket bridge.</p>
    <div id="status" class="status"><span class="dot"></span><span>Connecting to notification bridge…</span></div>
    <p>Latest bridge message</p>
    <pre id="message">Waiting for connection…</pre>
  </main>
  <script>
    const status = document.querySelector('#status');
    const message = document.querySelector('#message');
    const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
    socket.addEventListener('open', () => {
      status.className = 'status connected';
      status.lastElementChild.textContent = 'WebSocket bridge connected';
    });
    socket.addEventListener('message', event => {
      message.textContent = JSON.stringify(JSON.parse(event.data), null, 2);
    });
    socket.addEventListener('close', () => {
      status.className = 'status error';
      status.lastElementChild.textContent = 'WebSocket bridge disconnected';
    });
  </script>
</body>
</html>
